# Nginx config for the built SPA. Client-side routes (e.g. /runs/5) must fall
# back to index.html so a hard refresh / deep link resolves to the app shell.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for all other routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening headers (no secrets involved).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
